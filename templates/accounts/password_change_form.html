{% extends "base.html" %}

{% block content %}
<section class="account-layout container">
  {% include "components/account_sidebar.html" %}
  <div class="account-main account-panel">
    <p class="eyebrow">Security</p>
    <h1>Сменить пароль</h1>
    <form method="post" class="account-form" novalidate>
      {% csrf_token %}
      {% include "components/form_errors.html" with form=form %}
      {% for field in form %}
        <label class="form-field" for="{{ field.id_for_label }}">
          <span>{{ field.label }}</span>
          {{ field }}
          {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
        </label>
      {% endfor %}
      <button class="button button--primary" type="submit">Обновить пароль</button>
    </form>
  </div>
</section>
{% endblock %}
