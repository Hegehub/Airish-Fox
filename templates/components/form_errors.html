{% if form.non_field_errors %}
  <div class="form-errors" role="alert">
    {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
  </div>
{% endif %}
{% for field in form %}
  {% if field.errors %}
    <div class="form-errors" role="alert">
      <strong>{{ field.label }}:</strong>
      {% for error in field.errors %}<span>{{ error }}</span>{% endfor %}
    </div>
  {% endif %}
{% endfor %}
