<title>{{ page_title|default:brand_name }}</title>
<meta name="description" content="{{ meta_description|default:brand_description }}">
{% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}">{% endif %}
<meta property="og:type" content="{{ og_type|default:'website' }}">
<meta property="og:title" content="{{ og_title|default:page_title|default:brand_name }}">
<meta property="og:description" content="{{ og_description|default:meta_description|default:brand_description }}">
<meta property="og:site_name" content="{{ brand_name }}">
{% if canonical_url %}<meta property="og:url" content="{{ canonical_url }}">{% endif %}
{% if og_image %}<meta property="og:image" content="{{ og_image }}">{% endif %}
<meta name="twitter:card" content="{% if og_image %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:title" content="{{ og_title|default:page_title|default:brand_name }}">
<meta name="twitter:description" content="{{ og_description|default:meta_description|default:brand_description }}">
{% if og_image %}<meta name="twitter:image" content="{{ og_image }}">{% endif %}
