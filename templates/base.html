{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title|default:site_settings.site_name }}</title>
  <meta name="description" content="{{ meta_description|default:site_settings.short_description }}">
  <meta property="og:title" content="{{ page_title|default:site_settings.site_name }}">
  <meta property="og:description" content="{{ meta_description|default:site_settings.short_description }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site_settings.site_name }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { catMint: '#B8F2D0', bitcoin: '#F7931A', milk: '#FFF7EA', graphite: '#242424', fox: '#D95F18', softPink: '#FFB6C8' } } } }
  </script>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="bg-milk text-graphite antialiased">
  {% include 'components/navbar.html' %}
  {% if messages %}
    <div class="fixed right-4 top-24 z-50 space-y-3">
      {% for message in messages %}<div class="rounded-3xl bg-catMint px-5 py-4 font-semibold shadow-xl">{{ message }}</div>{% endfor %}
    </div>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
  {% include 'components/footer.html' %}
</body>
</html>
